name: Build App

on:
  workflow_dispatch:
  push:
    branches: [main, ios15-history-fix]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app

      - name: Ensure iOS platform is installed
        run: xcodebuild -downloadPlatform iOS

      - name: Restore Xcode build cache
        uses: actions/cache@v4
        with:
          path: build/DerivedDataApp
          key: asspp-ios-derived-v1-${{ runner.os }}-xcode26-${{ hashFiles('Asspp.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build
        run: |
          chmod +x Resources/Scripts/compile.release.mobile.ci.sh
          ./Resources/Scripts/compile.release.mobile.ci.sh "$(pwd)" "$(pwd)/Asspp.ipa"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Asspp.ipa
          path: Asspp.ipa
